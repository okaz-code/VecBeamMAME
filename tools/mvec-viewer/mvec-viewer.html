&lt;body&gt;
&lt;div id=&quot;mvec-viewer-root&quot;&gt;
  &lt;div class=&quot;viz-controls mvec-toolbar&quot;&gt;
    &lt;label class=&quot;form-label&quot;&gt;MVEC file
      &lt;input id=&quot;mvec-file&quot; class=&quot;form-control&quot; type=&quot;file&quot; accept=&quot;.mvec,application/octet-stream&quot;&gt;

    &lt;label class=&quot;form-label&quot;&gt;Orientation

    &lt;/label&gt;

    &lt;/label&gt;

  &lt;div class=&quot;viz-controls mvec-transport&quot;&gt;
    &lt;button id=&quot;mvec-first&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;|&amp;lt;&lt;/button&gt;
    &lt;button id=&quot;mvec-prev&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;Prev&lt;/button&gt;
    &lt;button id=&quot;mvec-play&quot; class=&quot;btn btn-primary&quot; type=&quot;button&quot; disabled&gt;Play&lt;/button&gt;
    &lt;button id=&quot;mvec-next&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled&gt;Next&lt;/button&gt;

      &lt;button id=&quot;mvec-zoom-out&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled title=&quot;Zoom out (wheel down / - key)&quot;&gt;−&lt;/button&gt;
      &lt;button id=&quot;mvec-zoom-in&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled title=&quot;Zoom in (wheel up / + key)&quot;&gt;＋&lt;/button&gt;
      &lt;button id=&quot;mvec-zoom-reset&quot; class=&quot;btn&quot; type=&quot;button&quot; disabled title=&quot;Fit the whole frame (double-click / 0 key)&quot;&gt;Fit&lt;/button&gt;
    &lt;/span&gt;

  &lt;label class=&quot;form-label mvec-range-label&quot; for=&quot;mvec-frame-range&quot;&gt;Frame position&lt;/label&gt;
  &lt;input id=&quot;mvec-frame-range&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;1&quot; value=&quot;1&quot; disabled&gt;

  &lt;div id=&quot;mvec-workspace&quot; class=&quot;mvec-workspace&quot;&gt;
    &lt;div class=&quot;mvec-stage&quot;&gt;
      &lt;canvas id=&quot;mvec-canvas&quot; role=&quot;img&quot; aria-label=&quot;Vector view of the selected MVEC frame&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;

    &lt;section id=&quot;mvec-reference-panel&quot; class=&quot;mvec-reference&quot; hidden aria-label=&quot;Vector data of the current frame&quot;&gt;
      &lt;div class=&quot;viz-controls mvec-reference-controls&quot;&gt;
        &lt;button id=&quot;mvec-vector-prev&quot; class=&quot;btn&quot; type=&quot;button&quot;&gt;Prev row&lt;/button&gt;
        &lt;button id=&quot;mvec-vector-next&quot; class=&quot;btn&quot; type=&quot;button&quot;&gt;Next row&lt;/button&gt;
        &lt;label class=&quot;form-label mvec-vector-field&quot;&gt;Vector row
          &lt;input id=&quot;mvec-vector-number&quot; class=&quot;form-control&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;1&quot;&gt;
        &lt;/label&gt;
        &lt;label class=&quot;form-label mvec-rows-field&quot;&gt;Rows shown
          &lt;select id=&quot;mvec-row-count&quot; class=&quot;form-select&quot;&gt;
            &lt;option value=&quot;10&quot;&gt;10&lt;/option&gt;

        &lt;table class=&quot;mvec-table&quot;&gt;
          &lt;thead&gt;
            &lt;tr&gt;
              &lt;th&gt;row&lt;/th&gt;
              &lt;th&gt;kind&lt;/th&gt;

              &lt;th&gt;y0&lt;/th&gt;

              &lt;th&gt;RGB&lt;/th&gt;

              &lt;th data-tooltip=&quot;Draw time of this vector: t1 - t0&quot;&gt;dt µs&lt;/th&gt;
              &lt;th data-tooltip=&quot;This vector&#x27;s share of the total draw time of the frame&quot;&gt;dt %&lt;/th&gt;
              &lt;th data-tooltip=&quot;Draw time per unit of segment length: dt / len&quot;&gt;µs/len&lt;/th&gt;
              &lt;th&gt;caps&lt;/th&gt;
              &lt;th&gt;scale&lt;/th&gt;
              &lt;th&gt;ramp µs&lt;/th&gt;

  &lt;div id=&quot;mvec-frame-meta&quot; class=&quot;text-small text-muted&quot;&gt;Recorded frame ID — · vectors —&lt;/div&gt;

&lt;style&gt;
  #mvec-viewer-root { width: 100%; }

  #mvec-viewer-root .mvec-workspace { width: 100%; }

  #mvec-viewer-root .mvec-stage {

  #mvec-viewer-root .mvec-zoom-group { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }

  #mvec-viewer-root .mvec-frame-field { max-width: 150px; }
  #mvec-viewer-root .mvec-vector-field { max-width: 150px; }

  #mvec-viewer-root .mvec-frame-meta,
  #mvec-viewer-root .mvec-selection { margin-top: 6px; font-variant-numeric: tabular-nums; }
  #mvec-viewer-root .mvec-reference { min-width: 0; margin: 8px 0; }
  #mvec-viewer-root .mvec-reference-controls { margin-bottom: 6px; }
  /* Both axes scroll here: the row-count select keeps the box short enough that the
     horizontal scrollbar stays on screen, and max-height covers the largest choice. */
  #mvec-viewer-root .mvec-table-wrap {
    margin-top: 6px;
    max-height: 70vh;
    overflow: auto;
    overscroll-behavior: contain;

  /* min-width: max-content keeps every column at its natural width instead of
     squeezing them, so the wrapper really does scroll horizontally. */

  #mvec-viewer-root .mvec-table th,

  /* A collapsed border does not travel with a sticky header, so draw the rule

&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  &#x27;use strict&#x27;;
  const root = document.getElementById(&#x27;mvec-viewer-root&#x27;);
  const el = id =&gt; root.querySelector(&#x27;#&#x27; + id);
  const fileInput = el(&#x27;mvec-file&#x27;);
  const rotation = el(&#x27;mvec-rotation&#x27;);
  const showBlank = el(&#x27;mvec-blank&#x27;);
  const showOverscan = el(&#x27;mvec-overscan&#x27;);
  const status = el(&#x27;mvec-status&#x27;);
  const canvas = el(&#x27;mvec-canvas&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;, { alpha: false });
  const first = el(&#x27;mvec-first&#x27;);
  const prev = el(&#x27;mvec-prev&#x27;);
  const play = el(&#x27;mvec-play&#x27;);
  const next = el(&#x27;mvec-next&#x27;);
  const last = el(&#x27;mvec-last&#x27;);
  const number = el(&#x27;mvec-frame-number&#x27;);
  const count = el(&#x27;mvec-frame-count&#x27;);
  const range = el(&#x27;mvec-frame-range&#x27;);
  const meta = el(&#x27;mvec-frame-meta&#x27;);
  const selection = el(&#x27;mvec-selection&#x27;);
  const workspace = el(&#x27;mvec-workspace&#x27;);
  const referenceMode = el(&#x27;mvec-reference-mode&#x27;);
  const referencePanel = el(&#x27;mvec-reference-panel&#x27;);
  const vectorPrev = el(&#x27;mvec-vector-prev&#x27;);
  const vectorNext = el(&#x27;mvec-vector-next&#x27;);
  const vectorNumber = el(&#x27;mvec-vector-number&#x27;);
  const vectorCount = el(&#x27;mvec-vector-count&#x27;);
  const vectorRange = el(&#x27;mvec-vector-range&#x27;);
  const rowCount = el(&#x27;mvec-row-count&#x27;);
  const rowWindow = el(&#x27;mvec-row-window&#x27;);
  const vectorRows = el(&#x27;mvec-vector-rows&#x27;);
  const tableWrap = root.querySelector(&#x27;.mvec-table-wrap&#x27;);
  const tableHead = root.querySelector(&#x27;.mvec-table thead&#x27;);
  const zoomLabel = el(&#x27;mvec-zoom&#x27;);
  const zoomIn = el(&#x27;mvec-zoom-in&#x27;);
  const zoomOut = el(&#x27;mvec-zoom-out&#x27;);
  const zoomReset = el(&#x27;mvec-zoom-reset&#x27;);
  const transport = [first, prev, play, next, last, number, range];

  // How many table rows the reference panel shows at once, centred on the selection.
  // Kept small by default because a full frame can hold up to 20000 vectors.
  const DEFAULT_ROW_WINDOW = 15;
  function rowWindowSize() {
    const value = Number(rowCount.value);
    return Number.isFinite(value) &amp;&amp; value &gt; 0 ? value : DEFAULT_ROW_WINDOW;
  }

  // Vector coordinates are stored in 1/65536 of a screen unit, the same units as
  // frame.vis, so both axes share one scale and lengths are directly comparable.
  const COORD_UNIT = 65536;

  const state = {
    file: null,          // Never load the whole file into an ArrayBuffer: past 2GB the browser cannot.
    payloads: new Map(), // frame index -&gt; that frame&#x27;s payload (only the ones actually needed)
    frames: [],
    cache: new Map(),
    current: 0,
    selected: -1,
    playing: false,
    lastTick: 0,
    system: &#x27;&#x27;,
    device: &#x27;&#x27;,
    fileName: &#x27;&#x27;,
    drawRect: null,
    drawPoints: null,
    zoom: 1,          // 1 = whole frame fitted
    panX: 0,          // CSS px, offset from the canvas centre
    panY: 0,
    drag: null,
    dragMoved: false
  };

  const CRC_TABLE = (() =&gt; {
    const table = new Uint32Array(256);
    for (let n = 0; n &lt; 256; n++) {
      let c = n;
      for (let k = 0; k &lt; 8; k++) c = (c &amp; 1) ? (0xedb88320 ^ (c &gt;&gt;&gt; 1)) : (c &gt;&gt;&gt; 1);
      table[n] = c &gt;&gt;&gt; 0;
    }
    return table;
  })();

  function crc32(bytes, offset, length) {
    let c = 0xffffffff;
    const end = offset + length;
    for (let i = offset; i &lt; end; i++) c = CRC_TABLE[(c ^ bytes[i]) &amp; 0xff] ^ (c &gt;&gt;&gt; 8);
    return (c ^ 0xffffffff) &gt;&gt;&gt; 0;
  }

  // Scan window. A frame payload is at most 36 + 20000*66 = about 1.3MB, so 16MB
  // always holds a whole frame. We never read the entire file at once because
  // recordings over 2GB (starwars / mhavoc) hit the ArrayBuffer limit and fail
  // with NotReadableError.
  const SCAN_WINDOW = 1 &lt;&lt; 24;

  async function parseMvec(file, name, progress) {
    let winStart = 0;
    let bytes = new Uint8Array(await file.slice(0, Math.min(SCAN_WINDOW, file.size)).arrayBuffer());
    let view = new DataView(bytes.buffer);
    const rel = abs =&gt; abs - winStart;
    async function need(abs, size, label) {
      if (size &lt; 0 || abs &lt; 0 || abs + size &gt; file.size) throw new Error(label + &#x27; is truncated.&#x27;);
      if (abs &gt;= winStart &amp;&amp; abs + size &lt;= winStart + bytes.length) return;
      if (size &gt; SCAN_WINDOW) throw new Error(label + &#x27; is too large.&#x27;);
      winStart = abs;
      const buf = await file.slice(abs, Math.min(abs + SCAN_WINDOW, file.size)).arrayBuffer();
      bytes = new Uint8Array(buf);
      view = new DataView(buf);
    }
    let pos = 0;
    await need(0, 16, &#x27;The MVEC header&#x27;);
    const expected = [77, 65, 77, 69, 86, 69, 67, 0];
    for (let i = 0; i &lt; expected.length; i++) {
      if (bytes[i] !== expected[i]) throw new Error(&#x27;Not an MVEC v1 file.&#x27;);
    }
    pos = 8;
    const major = view.getUint16(rel(pos), true); pos += 2;
    const minor = view.getUint16(rel(pos), true); pos += 2;
    const endian = view.getUint32(rel(pos), true); pos += 4;
    if (major !== 1 || minor &gt; 1 || endian !== 0x12345678) throw new Error(`Unsupported MVEC format (${major}.${minor}).`);

    const decoder = new TextDecoder(&#x27;utf-8&#x27;);
    async function readString() {
      await need(pos, 2, &#x27;An MVEC string&#x27;);
      const length = view.getUint16(rel(pos), true); pos += 2;
      await need(pos, length, &#x27;An MVEC string&#x27;);
      const value = decoder.decode(bytes.subarray(rel(pos), rel(pos) + length));
      pos += length;
      return value;
    }

    const systemName = await readString();
    const deviceName = await readString();
    // v1.1 appends the recorded frame period in attoseconds (vector.cpp write_header/read_header).
    // 0 or missing means the recorder did not know it; playback then infers it.
    let framePeriodAs = 0;
    if (minor &gt;= 1) {
      await need(pos, 8, &#x27;The MVEC frame period&#x27;);
      framePeriodAs = Number(view.getBigInt64(rel(pos), true)); pos += 8;
    }
    const frames = [];
    let lastContent = -1;
    while (pos &lt; file.size) {
      await need(pos, 8, &#x27;A frame chunk&#x27;);
      const magic = view.getUint32(rel(pos), true);
      if (magic !== 0x4d415246) throw new Error(`Frame ${frames.length + 1} has a bad FRAM marker.`);
      const payloadSize = view.getUint32(rel(pos) + 4, true);
      const payload = pos + 8;
      if (payloadSize &lt; 36) throw new Error(`Frame ${frames.length + 1} has a payload that is too short.`);
      // The window may shift here, so never reuse a rel() result taken before this call.
      await need(payload, payloadSize + 4, `Frame ${frames.length + 1}`);
      const storedCrc = view.getUint32(rel(payload) + payloadSize, true);
      const actualCrc = crc32(bytes, rel(payload), payloadSize);
      if (storedCrc !== actualCrc) throw new Error(`Frame ${frames.length + 1} has a CRC mismatch.`);

      const id = view.getBigUint64(rel(payload), true);
      const flags = view.getUint32(rel(payload) + 8, true);
      const stale = (flags &amp; 1) !== 0;
      const pointCount = view.getUint32(rel(payload) + 32, true);
      if (progress &amp;&amp; (frames.length &amp; 511) === 0) progress(pos, file.size);
      const expectedSize = 36 + pointCount * 66;
      if (expectedSize !== payloadSize) throw new Error(`Frame ${frames.length + 1} has a vector count that disagrees with its size.`);
      if (stale &amp;&amp; pointCount !== 0) throw new Error(`Stale frame ${frames.length + 1} stores vectors.`);
      if (!stale) lastContent = frames.length;

      frames.push({
        payload,
        payloadSize,
        id,
        stale,
        timed: (flags &amp; 2) !== 0,
        generation: view.getUint32(rel(payload) + 12, true),
        vis: {
          minX: view.getInt32(rel(payload) + 16, true),
          maxX: view.getInt32(rel(payload) + 20, true),
          minY: view.getInt32(rel(payload) + 24, true),
          maxY: view.getInt32(rel(payload) + 28, true)
        },
        storedCount: pointCount,
        contentFrame: stale ? lastContent : frames.length
      });
      pos = payload + payloadSize + 4;
    }
    if (!frames.length) throw new Error(&#x27;No frames were recorded.&#x27;);

    state.file = file;
    state.payloads.clear();
    state.frames = frames;
    state.cache.clear();
    state.current = 0;
    state.selected = -1;
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
    state.drag = null;
    state.dragMoved = false;
    referenceMode.checked = false;
    referenceMode.disabled = false;
    referencePanel.hidden = true;
    workspace.classList.remove(&#x27;reference-active&#x27;);
    state.system = systemName;
    state.device = deviceName;
    state.fileName = name;
    state.version = `${major}.${minor}`;
    state.framePeriodAs = framePeriodAs;
    state.frameHz = framePeriodAs &gt; 0 ? 1e18 / framePeriodAs : 0;
  }

  // Read only the payload of the frame we need to show; never keep the whole file.
  async function ensureContent(sourceIndex) {
    if (sourceIndex &lt; 0) return;
    if (state.cache.has(sourceIndex) || state.payloads.has(sourceIndex)) return;
    const source = state.frames[sourceIndex];
    const buffer = await state.file.slice(source.payload, source.payload + source.payloadSize).arrayBuffer();
    state.payloads.set(sourceIndex, buffer);
    if (state.payloads.size &gt; 12) state.payloads.delete(state.payloads.keys().next().value);
  }

  function decodeContent(frameIndex) {
    const frame = state.frames[frameIndex];
    const sourceIndex = frame.contentFrame;
    if (sourceIndex &lt; 0) return [];
    if (state.cache.has(sourceIndex)) return state.cache.get(sourceIndex);
    const source = state.frames[sourceIndex];
    const payload = state.payloads.get(sourceIndex);
    if (!payload) return [];              // ensureContent has not fetched it yet
    const view = new DataView(payload);
    let pos = 36;                         // relative to the start of the payload
    const points = new Array(source.storedCount);
    for (let i = 0; i &lt; points.length; i++) {
      const x0 = view.getInt32(pos, true); pos += 4;
      const y0 = view.getInt32(pos, true); pos += 4;
      const x = view.getInt32(pos, true); pos += 4;
      const y = view.getInt32(pos, true); pos += 4;
      const color = view.getUint32(pos, true); pos += 4;
      const intensity = view.getUint8(pos); pos += 1;
      const energy = view.getFloat32(pos, true); pos += 4;
      const t0s = view.getInt32(pos, true); pos += 4;
      const t0a = view.getBigInt64(pos, true); pos += 8;
      const t1s = view.getInt32(pos, true); pos += 4;
      const t1a = view.getBigInt64(pos, true); pos += 8;
      const caps = view.getUint32(pos, true); pos += 4;
      const scale = view.getInt32(pos, true); pos += 4;
      const rampUs = view.getFloat64(pos, true); pos += 8;
      const midchange = view.getUint8(pos) !== 0; pos += 1;
      points[i] = {
        x0, y0, x, y, color, intensity, energy, caps, scale, rampUs, midchange,
        t0: Number(t0s) + Number(t0a) / 1e18,
        t1: Number(t1s) + Number(t1a) / 1e18
      };
    }
    state.cache.set(sourceIndex, points);
    if (state.cache.size &gt; 12) state.cache.delete(state.cache.keys().next().value);
    return points;
  }

  function oriented(nx, ny) {
    switch (rotation.value) {
      case &#x27;90&#x27;: return [1 - ny, nx];
      case &#x27;180&#x27;: return [1 - nx, 1 - ny];
      case &#x27;270&#x27;: return [ny, 1 - nx];
      default: return [nx, ny];
    }
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    return { w, h, dpr };
  }

  function render() {
    const { w, h, dpr } = resizeCanvas();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = &#x27;source-over&#x27;;
    ctx.globalAlpha = 1;
    ctx.fillStyle = &#x27;#000&#x27;;
    ctx.fillRect(0, 0, w, h);
    state.drawPoints = null;
    state.drawRect = null;
    if (!state.frames.length) return;

    const frame = state.frames[state.current];
    const points = decodeContent(state.current);
    const rotated = rotation.value === &#x27;90&#x27; || rotation.value === &#x27;270&#x27;;
    const visW = Math.max(1, frame.vis.maxX - frame.vis.minX + 1);
    const visH = Math.max(1, frame.vis.maxY - frame.vis.minY + 1);
    const aspect = rotated ? visH / visW : visW / visH;
    const pad = 18 * dpr;
    let drawW = Math.max(1, w - pad * 2);
    let drawH = drawW / aspect;
    if (drawH &gt; h - pad * 2) {
      drawH = Math.max(1, h - pad * 2);
      drawW = drawH * aspect;
    }
    // Zoom and drag. zoom is a factor with 1 = whole frame fitted; pan is in CSS px,
    // so it tracks mouse movement 1:1.
    drawW *= state.zoom;
    drawH *= state.zoom;
    const panLimitX = Math.max(0, (drawW - w) * 0.5) / dpr + 48;
    const panLimitY = Math.max(0, (drawH - h) * 0.5) / dpr + 48;
    state.panX = Math.min(panLimitX, Math.max(-panLimitX, state.panX));
    state.panY = Math.min(panLimitY, Math.max(-panLimitY, state.panY));
    const ox = (w - drawW) * 0.5 + state.panX * dpr;
    const oy = (h - drawH) * 0.5 + state.panY * dpr;
    state.drawRect = { ox, oy, drawW, drawH };

    function map(x, y) {
      let nx = (x - frame.vis.minX) / (65536 * visW);
      let ny = (y - frame.vis.minY) / (65536 * visH);
      if (showOverscan.checked) {
        // Match MAME vector_overscan_x/y 0.5: shrink about the screen centre so
        // raw coordinates from -0.5 through 1.5 become visible in the output.
        nx = (nx - 0.5) * 0.5 + 0.5;
        ny = (ny - 0.5) * 0.5 + 0.5;
      }
      const [rx, ry] = oriented(nx, ny);
      return [ox + rx * drawW, oy + ry * drawH];
    }

    ctx.strokeStyle = &#x27;rgba(255,255,255,0.22)&#x27;;
    ctx.lineWidth = Math.max(1, dpr);
    ctx.strokeRect(ox, oy, drawW, drawH);
    if (showOverscan.checked) {
      // The recorded visible area occupies the centre half at overscan 0.5.
      ctx.save();
      ctx.setLineDash([5 * dpr, 4 * dpr]);
      ctx.strokeStyle = &#x27;rgba(255,255,255,0.34)&#x27;;
      ctx.strokeRect(ox + drawW * 0.25, oy + drawH * 0.25, drawW * 0.5, drawH * 0.5);
      ctx.restore();
    }
    ctx.save();
    ctx.beginPath();
    ctx.rect(ox, oy, drawW, drawH);
    ctx.clip();
    ctx.globalCompositeOperation = &#x27;lighter&#x27;;
    ctx.lineCap = &#x27;round&#x27;;
    const mapped = new Array(points.length);
    const drawLimit = referenceMode.checked &amp;&amp; state.selected &gt;= 0
      ? Math.min(state.selected, points.length - 1) : points.length - 1;

    for (let i = 0; i &lt; points.length; i++) {
      const p = points[i];
      const a = map(p.x0, p.y0);
      const b = map(p.x, p.y);
      mapped[i] = [a[0], a[1], b[0], b[1]];
      if (i &gt; drawLimit) continue;
      if (p.intensity === 0) {
        if (!showBlank.checked) continue;
        ctx.globalCompositeOperation = &#x27;source-over&#x27;;
        ctx.strokeStyle = &#x27;rgba(120,120,120,0.22)&#x27;;
        ctx.lineWidth = Math.max(1, dpr);
      } else {
        const r = (p.color &gt;&gt;&gt; 16) &amp; 255;
        const g = (p.color &gt;&gt;&gt; 8) &amp; 255;
        const bcol = p.color &amp; 255;
        const alpha = Math.max(0.04, Math.min(1, p.intensity / 255));
        ctx.globalCompositeOperation = &#x27;lighter&#x27;;
        ctx.strokeStyle = `rgba(${r},${g},${bcol},${alpha})`;
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = Math.max(1.1 * dpr, 0.0018 * Math.min(drawW, drawH));
      }
      const isPoint = p.x0 === p.x &amp;&amp; p.y0 === p.y;
      if (isPoint) {
        const radius = p.intensity === 0 ? 1.2 * dpr : Math.max(1.6 * dpr, ctx.lineWidth * 0.9);
        ctx.beginPath();
        ctx.arc(b[0], b[1], radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
      }
    }

    if (state.selected &gt;= 0 &amp;&amp; state.selected &lt; points.length) {
      const m = mapped[state.selected];
      ctx.globalCompositeOperation = &#x27;source-over&#x27;;
      ctx.strokeStyle = &#x27;#ffd23f&#x27;;
      ctx.fillStyle = &#x27;#ffd23f&#x27;;
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      ctx.moveTo(m[0], m[1]);
      ctx.lineTo(m[2], m[3]);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(m[2], m[3], 4 * dpr, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    state.drawPoints = mapped;
  }

  // Segment length in screen units. x/y share one scale, so this is comparable
  // across both axes and against frame.vis extents.
  function segmentLength(point) {
    return Math.hypot(point.x - point.x0, point.y - point.y0) / COORD_UNIT;
  }

  // Draw time in µs. Only timed frames carry usable stamps; untimed records store
  // huge values, which is what the 1e8 guard rejects.
  function drawTime(frame, point) {
    if (!frame || !frame.timed) return NaN;
    if (!Number.isFinite(point.t0) || !Number.isFinite(point.t1) || point.t0 &gt;= 1e8) return NaN;
    return Math.max(0, (point.t1 - point.t0) * 1e6);
  }

  // Total beam time of the frame, used as the denominator of the dt % column.
  // Blank moves are included: the beam spends that time too.
  function frameDrawTotal(frame, points) {
    let total = 0;
    for (const point of points) {
      const dt = drawTime(frame, point);
      if (Number.isFinite(dt)) total += dt;
    }
    return total;
  }

  function fixedOrDash(value, digits) {
    return Number.isFinite(value) ? value.toFixed(digits) : &#x27;—&#x27;;
  }

  function vectorDetail(index) {
    const points = decodeContent(state.current);
    if (index &lt; 0 || index &gt;= points.length) {
      selection.textContent = &#x27;Click a vector to see its details.&#x27;;
      return;
    }
    const p = points[index];
    const hex = &#x27;#&#x27; + (p.color &amp; 0xffffff).toString(16).padStart(6, &#x27;0&#x27;).toUpperCase();
    const kind = p.x0 === p.x &amp;&amp; p.y0 === p.y ? &#x27;point&#x27; : (p.intensity === 0 ? &#x27;blank move&#x27; : &#x27;line&#x27;);
    const frame = state.frames[state.current];
    const duration = drawTime(frame, p);
    const length = segmentLength(p);
    const total = frameDrawTotal(frame, points);
    const share = Number.isFinite(duration) &amp;&amp; total &gt; 0 ? duration / total * 100 : NaN;
    const perUnit = Number.isFinite(duration) &amp;&amp; length &gt; 0 ? duration / length : NaN;
    selection.textContent = `Vector ${index + 1} / ${points.length} · ${kind} · RGB ${hex}`
      + ` · intensity ${p.intensity} · energy ${p.energy.toFixed(4)}`
      + ` · len ${length.toFixed(2)} · draw time ${fixedOrDash(duration, 3)} µs`
      + ` · ${fixedOrDash(share, 2)}% of the frame · ${fixedOrDash(perUnit, 4)} µs/len`
      + ` · caps 0x${p.caps.toString(16)}`;
  }

  function vectorKind(point) {
    return point.x0 === point.x &amp;&amp; point.y0 === point.y ? &#x27;point&#x27; : (point.intensity === 0 ? &#x27;blank&#x27; : &#x27;line&#x27;);
  }

  function vectorTime(value) {
    return Number.isFinite(value) &amp;&amp; value &lt; 1e8 ? value.toFixed(6) : &#x27;—&#x27;;
  }

  function renderReferenceRows(points) {
    vectorRows.replaceChildren();
    const total = points.length;
    const hasRows = total &gt; 0;
    vectorPrev.disabled = !hasRows || state.selected &lt;= 0;
    vectorNext.disabled = !hasRows || state.selected &gt;= total - 1;
    vectorNumber.disabled = !hasRows;
    vectorRange.disabled = !hasRows;
    vectorNumber.max = String(Math.max(1, total));
    vectorRange.max = String(Math.max(1, total));
    if (!hasRows) {
      state.selected = -1;
      vectorNumber.value = &#x27;1&#x27;;
      vectorRange.value = &#x27;1&#x27;;
      vectorCount.textContent = &#x27;Row 0 / 0&#x27;;
      rowWindow.textContent = &#x27;Rows —&#x27;;
      return;
    }

    state.selected = Math.max(0, Math.min(total - 1, state.selected));
    vectorNumber.value = String(state.selected + 1);
    vectorRange.value = String(state.selected + 1);
    vectorCount.textContent = &#x27;Row &#x27; + (state.selected + 1) + &#x27; / &#x27; + total;

    const frame = state.frames[state.current];
    const drawTotal = frameDrawTotal(frame, points);
    const size = rowWindowSize();
    const maxStart = Math.max(0, total - size);
    const start = Math.max(0, Math.min(maxStart, state.selected - Math.floor(size / 2)));
    const end = Math.min(total, start + size);
    rowWindow.textContent = &#x27;Rows &#x27; + (start + 1) + &#x27;–&#x27; + end + &#x27; / &#x27; + total
      + &#x27; (up to &#x27; + size + &#x27;, centred on the selection) · frame draw time &#x27;
      + (drawTotal &gt; 0 ? (drawTotal / 1000).toFixed(3) + &#x27; ms&#x27; : &#x27;—&#x27;);

    const fragment = document.createDocumentFragment();
    for (let i = start; i &lt; end; i++) {
      const p = points[i];
      const hex = &#x27;#&#x27; + (p.color &amp; 0xffffff).toString(16).padStart(6, &#x27;0&#x27;).toUpperCase();
      const length = segmentLength(p);
      const dt = drawTime(frame, p);
      const share = Number.isFinite(dt) &amp;&amp; drawTotal &gt; 0 ? dt / drawTotal * 100 : NaN;
      const perUnit = Number.isFinite(dt) &amp;&amp; length &gt; 0 ? dt / length : NaN;
      const values = [
        i + 1, vectorKind(p), p.x0, p.y0, p.x, p.y, length.toFixed(2), hex, p.intensity,
        p.energy.toFixed(4), vectorTime(p.t0), vectorTime(p.t1),
        fixedOrDash(dt, 3), fixedOrDash(share, 2), fixedOrDash(perUnit, 4),
        &#x27;0x&#x27; + p.caps.toString(16), p.scale &lt; 0 ? &#x27;—&#x27; : p.scale,
        p.rampUs &lt; 0 ? &#x27;—&#x27; : p.rampUs.toFixed(3), p.midchange ? &#x27;yes&#x27; : &#x27;&#x27;
      ];
      const row = document.createElement(&#x27;tr&#x27;);
      row.setAttribute(&#x27;aria-selected&#x27;, i === state.selected ? &#x27;true&#x27; : &#x27;false&#x27;);
      row.setAttribute(&#x27;aria-label&#x27;, &#x27;Vector row &#x27; + (i + 1));
      for (const value of values) {
        const cell = document.createElement(&#x27;td&#x27;);
        cell.textContent = String(value);
        row.appendChild(cell);
      }
      row.addEventListener(&#x27;click&#x27;, () =&gt; selectVector(i));
      fragment.appendChild(row);
    }
    vectorRows.appendChild(fragment);

    // With a large row window the selection can sit outside the scrolled box.
    // Only tableWrap.scrollTop is touched, so the page itself never jumps.
    const selectedRow = vectorRows.children[state.selected - start];
    if (selectedRow &amp;&amp; tableWrap) {
      const box = tableWrap.getBoundingClientRect();
      const row = selectedRow.getBoundingClientRect();
      const headHeight = tableHead ? tableHead.getBoundingClientRect().height : 0;
      if (row.top &lt; box.top + headHeight) tableWrap.scrollTop -= box.top + headHeight - row.top;
      else if (row.bottom &gt; box.bottom) tableWrap.scrollTop += row.bottom - box.bottom;
    }
  }

  function selectVector(index) {
    const points = decodeContent(state.current);
    if (!points.length) {
      state.selected = -1;
      renderReferenceRows(points);
      vectorDetail(-1);
      render();
      return;
    }
    setPlaying(false);
    state.selected = Math.max(0, Math.min(points.length - 1, index));
    renderReferenceRows(points);
    vectorDetail(state.selected);
    render();
  }
  async function updateFrame(index) {
    if (!state.frames.length) return;
    state.current = Math.max(0, Math.min(state.frames.length - 1, index));
    await ensureContent(state.frames[state.current].contentFrame);
    state.selected = referenceMode.checked ? 0 : -1;
    const human = state.current + 1;
    const frame = state.frames[state.current];
    const points = decodeContent(state.current);
    number.value = String(human);
    range.value = String(human);
    count.textContent = `Data ${human} / ${state.frames.length}`;
    const sourceText = frame.stale &amp;&amp; frame.contentFrame &gt;= 0 ? ` · stale (content from data ${frame.contentFrame + 1})` : &#x27;&#x27;;
    meta.textContent = `Recorded frame ID ${frame.id.toString()} · generation ${frame.generation} · vectors ${points.length}${sourceText}`;
    if (referenceMode.checked) {
      renderReferenceRows(points);
      vectorDetail(state.selected);
    } else {
      vectorDetail(-1);
    }
    render();
  }

  function setPlaying(value) {
    state.playing = Boolean(value &amp;&amp; state.frames.length);
    play.textContent = state.playing ? &#x27;Stop&#x27; : &#x27;Play&#x27;;
    play.setAttribute(&#x27;aria-pressed&#x27;, state.playing ? &#x27;true&#x27; : &#x27;false&#x27;);
    state.lastTick = 0;
    if (state.playing) requestAnimationFrame(tick);
  }

  function tick(time) {
    if (!state.playing) return;
    if (!state.lastTick) state.lastTick = time;
    if (time - state.lastTick &gt;= 1000 / 60) {
      state.lastTick = time;
      if (state.current &gt;= state.frames.length - 1) setPlaying(false);
      else updateFrame(state.current + 1);
    }
    if (state.playing) requestAnimationFrame(tick);
  }

  async function loadFile(file) {
    setPlaying(false);
    status.textContent = `Reading ${file.name} and verifying the CRC of every frame…`;
    try {
      await parseMvec(file, file.name, (done, size) =&gt; {
        status.textContent = `Reading ${file.name} and verifying the CRC of every frame… ${Math.floor(done / size * 100)}%`;
      });
      const total = state.frames.length;
      transport.forEach(control =&gt; control.disabled = false);
      number.max = String(total);
      range.max = String(total);
      status.textContent = `${file.name} · MVEC ${state.version} · system ${state.system} · device ${state.device} · ${total} frames${state.frameHz ? ` · ${state.frameHz.toFixed(3)}Hz` : &#x27;&#x27;} (CRC OK)`;
      await updateFrame(0);
      updateZoomUi();
    } catch (error) {
      state.frames = [];
      transport.forEach(control =&gt; control.disabled = true);
      referenceMode.checked = false;
      referenceMode.disabled = true;
      referencePanel.hidden = true;
      workspace.classList.remove(&#x27;reference-active&#x27;);
      vectorRows.replaceChildren();
      count.textContent = &#x27;Data 0 / 0&#x27;;
      meta.textContent = &#x27;Recorded frame ID — · vectors —&#x27;;
      status.textContent = `Load error: ${error instanceof Error ? error.message : String(error)}`;
      render();
    }
  }

  function distanceToSegment(px, py, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    const den = dx * dx + dy * dy;
    const t = den &gt; 0 ? Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / den)) : 0;
    return Math.hypot(px - (x0 + t * dx), py - (y0 + t * dy));
  }

  referenceMode.addEventListener(&#x27;change&#x27;, () =&gt; {
    setPlaying(false);
    referencePanel.hidden = !referenceMode.checked;
    workspace.classList.toggle(&#x27;reference-active&#x27;, referenceMode.checked);
    play.disabled = referenceMode.checked;
    if (referenceMode.checked) selectVector(state.selected &gt;= 0 ? state.selected : 0);
    else {
      state.selected = -1;
      vectorDetail(-1);
      render();
    }
  });
  rowCount.addEventListener(&#x27;change&#x27;, () =&gt; {
    if (referenceMode.checked) renderReferenceRows(decodeContent(state.current));
  });
  vectorPrev.addEventListener(&#x27;click&#x27;, () =&gt; selectVector(state.selected - 1));
  vectorNext.addEventListener(&#x27;click&#x27;, () =&gt; selectVector(state.selected + 1));
  vectorRange.addEventListener(&#x27;input&#x27;, () =&gt; selectVector(Number(vectorRange.value) - 1));
  vectorNumber.addEventListener(&#x27;change&#x27;, () =&gt; selectVector(Number(vectorNumber.value) - 1));
  vectorNumber.addEventListener(&#x27;keydown&#x27;, event =&gt; {
    if (event.key === &#x27;Enter&#x27;) selectVector(Number(vectorNumber.value) - 1);
  });
  fileInput.addEventListener(&#x27;change&#x27;, () =&gt; { if (fileInput.files &amp;&amp; fileInput.files[0]) loadFile(fileInput.files[0]); });
  rotation.addEventListener(&#x27;change&#x27;, render);
  showBlank.addEventListener(&#x27;change&#x27;, render);
  showOverscan.addEventListener(&#x27;change&#x27;, render);
  first.addEventListener(&#x27;click&#x27;, () =&gt; updateFrame(0));
  prev.addEventListener(&#x27;click&#x27;, () =&gt; updateFrame(state.current - 1));
  next.addEventListener(&#x27;click&#x27;, () =&gt; updateFrame(state.current + 1));
  last.addEventListener(&#x27;click&#x27;, () =&gt; updateFrame(state.frames.length - 1));
  play.addEventListener(&#x27;click&#x27;, () =&gt; setPlaying(!state.playing));
  range.addEventListener(&#x27;input&#x27;, () =&gt; updateFrame(Number(range.value) - 1));
  number.addEventListener(&#x27;change&#x27;, () =&gt; updateFrame(Number(number.value) - 1));
  number.addEventListener(&#x27;keydown&#x27;, event =&gt; { if (event.key === &#x27;Enter&#x27;) updateFrame(Number(number.value) - 1); });
  canvas.addEventListener(&#x27;click&#x27;, event =&gt; {
    if (state.dragMoved) { state.dragMoved = false; return; }   // the click that ends a drag must not select
    if (!state.drawPoints) return;
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    const px = (event.clientX - rect.left) * sx;
    const py = (event.clientY - rect.top) * sy;
    let best = -1, bestDistance = 10 * Math.max(sx, sy);
    const visiblePoints = decodeContent(state.current);
    for (let i = 0; i &lt; state.drawPoints.length; i++) {
      if (!showBlank.checked &amp;&amp; visiblePoints[i].intensity === 0) continue;
      const p = state.drawPoints[i];
      const d = distanceToSegment(px, py, p[0], p[1], p[2], p[3]);
      if (d &lt; bestDistance) { bestDistance = d; best = i; }
    }
    if (referenceMode.checked) { if (best &gt;= 0) selectVector(best); }
    else {
      state.selected = best;
      vectorDetail(best);
      render();
    }
  });
  // ---- Zoom / drag-to-pan (the same canvas is used in reference mode, so this just works) ----
  const ZOOM_MIN = 1, ZOOM_MAX = 40;
  function updateZoomUi() {
    const has = state.frames.length &gt; 0;
    zoomIn.disabled = !has || state.zoom &gt;= ZOOM_MAX - 1e-6;

name: "Bug report"
description: Report incorrect or unexpected behaviour in VecBeamMAME.
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      ## Before you file

      VecBeamMAME is an unofficial MAME build. It changes vector rendering and a few vector
      drivers, and nothing else. **If the same thing happens in a stock MAME build of the same
      version, it is not a VecBeamMAME bug** — please report it to
      [mamedev/mame](https://github.com/mamedev/mame/issues) instead. Checking that first is the
      single most useful thing you can do, because it separates an emulation problem from a
      rendering one before anyone has to guess.

      Setup questions go to [Discussions (Q&A)](https://github.com/okaz-code/VecBeamMAME/discussions/categories/q-a).
      English or Japanese are both fine. / 日本語でも英語でも構いません。

- type: input
  attributes:
    label: Build
    description: |
      A release tag, or the branch and commit you built. `vbmame -version` prints both: the MAME version it is based on, then the VecBeamMAME tag and commit in parentheses.
    placeholder: "v0.1.0, or main @ 65c921b"
  validations:
    required: true

- type: dropdown
  attributes:
    label: Does it also happen in stock MAME?
    options:
      - "No — stock MAME is fine, this is VecBeamMAME only"
      - "Yes — stock MAME does it too (please report upstream instead)"
      - "Not checked"
      - "Can't check (needs a VecBeamMAME-only feature)"
  validations:
    required: true

- type: textarea
  attributes:
    label: Machine
    description: |
      OS and version, CPU, GPU and driver version.
    placeholder: |
      Windows 11 23H2, Ryzen 7 5800X, GeForce RTX 4070 driver 566.36
      macOS 15.3, M2 Pro
  validations:
    required: true

- type: textarea
  attributes:
    label: Display
    description: |
      Panel, resolution and **refresh rate**, and whether HDR is on. Refresh rate matters: the
      presentation path samples the beam against it, so the same scene can behave differently at
      60, 120 and 165 Hz. If you have more than one display, say which one the window was on.
    placeholder: |
      LG C2 42", 3840x2160 @ 120 Hz, HDR on (Windows Auto HDR off)
      Built-in Liquid Retina XDR, 120 Hz, EDR active
  validations:
    required: true

- type: textarea
  attributes:
    label: Video settings
    description: |
      The bgfx backend and chain, and any options or chain sliders you changed from their
      defaults. Chain sliders are under Video Options; turn on Advanced Parameters to see all of
      them.
    placeholder: |
      -video bgfx -bgfx_backend d3d12 -bgfx_screen_chains vector/vector-color
      -bgfx_hdr 1 -bgfx_hdr_display_peak 1000
      [M] Bloom Strength 0.8, Phosphor Half-life 24 ms
  validations:
    required: true

- type: input
  attributes:
    label: Emulated system
    description: |
      The short name of the driver, and where in the game it happens.
    placeholder: "mhavoc — during the attract demo, first wave"
  validations:
    required: true

- type: textarea
  attributes:
    label: What happens
    description: |
      What you see, specifically. "It looks wrong" is not enough to act on — say which part of
      the picture, and what about it is wrong (too bright, too wide, flickering, wrong colour,
      missing).
  validations:
    required: true

- type: textarea
  attributes:
    label: What you expected instead
    description: |
      What it should look like. If you have a real machine or a recording of one, a photo or
      video is worth more than any description — say what it was shot on and at what frame rate.

- type: textarea
  attributes:
    label: Steps to reproduce
    description: |
      Assume the reader knows MAME but not this game.
    placeholder: |
      1. Started with: vbmame mhavoc -video bgfx ...
      2. Waited for the attract demo
      3. The barrier around the player is brighter on its left side than its right

- type: textarea
  attributes:
    label: Vector recording
    description: |
      **The most useful thing you can attach.** Run with `-vector_record foo.mvec` and attach the
      file (zip it — they are large, so a few seconds is plenty). It records the vector list with
      per-segment timing and colour, which means the exact frame you are looking at can be
      reproduced and measured here rather than guessed at. Say roughly which second or frame the
      problem is on.
    placeholder: |
      mhavoc.mvec attached, the barrier is visible around frame 1455

- type: textarea
  attributes:
    label: Anything else
    description: |
      Log output (`-verbose` is useful for HDR and beam-window problems), screenshots, or
      anything else relevant.
